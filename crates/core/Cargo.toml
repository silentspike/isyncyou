[package]
name = "isyncyou-core"
description = "Job model, scheduler, sync-state machine, conflict engine, config, self-check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
# At-rest body-file envelope encryption (#onedrive-mobile 0B). ring is already in the
# arm64 build (via graph), so it cross-compiles for Android without an OpenSSL toolchain —
# unlike SQLCipher's vendored OpenSSL, which is why the file bodies (not covered by
# SQLCipher anyway) get their own AES-256-GCM envelope.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
