name: Scorecard

# OpenSSF Scorecard: continuous supply-chain security posture scoring (branch
# protection, pinned actions, token permissions, dangerous workflows, etc.).
# Results land in the repo's code-scanning view and are published for the badge.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [dev] # repo default branch; scorecard-action only supports the default
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3.30.5
        with:
          sarif_file: results.sarif
