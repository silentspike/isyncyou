name: External pull request policy

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close-external:
    name: Close external pull request
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      (github.event.pull_request.user.login != 'dependabot[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Explain the contribution policy and close the pull request
        shell: bash
        run: |
          set -euo pipefail
          # Event metadata can differ from current membership. Recheck the same
          # actor policy immediately before taking any destructive action.
          decision=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -er --arg repo "$REPOSITORY" --argjson number "$PR_NUMBER" '
              .author_association as $association |
              if .number != $number or .base.repo.full_name != $repo or
                 (.user.login | type != "string") or .user.login == "" or
                 (["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR",
                   "FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR", "NONE", "MANNEQUIN"] |
                  index($association)) == null then
                error("Invalid pull request metadata")
              else . end |
              if .author_association == "OWNER" or
                 .author_association == "MEMBER" or
                 .author_association == "COLLABORATOR" or
                 (.user.login == "dependabot[bot]" and .head.repo.full_name == $repo)
              then "allow"
              else "close" end')
          if [ "$decision" = allow ]; then
            echo "Current PR metadata permits this author; no action needed."
            exit 0
          fi
          message=$(cat <<'EOF'
          Thank you for your interest in iSyncYou. This repository does not accept external pull requests.

          Reproducible bug reports and focused product suggestions are welcome through the [public feedback tracker](https://github.com/silentspike/isyncyou-feedback/issues/new/choose). Report security vulnerabilities privately through [GitHub Security Advisories](https://github.com/silentspike/isyncyou/security/advisories/new).
          EOF
          )
          gh api --method PATCH \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --raw-field state=closed >/dev/null
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --raw-field body="$message" >/dev/null
