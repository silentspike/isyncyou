name: Secret Scan

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run secret scan
        run: gitleaks detect --source . --no-git --redact --verbose

      - name: Scan incoming commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$HEAD_SHA^{commit}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "Unable to resolve the pull request base commit." >&2
            exit 1
          elif [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]] &&
               timeout 45s git fetch --quiet --no-tags --no-write-fetch-head origin "$BEFORE" 2>/dev/null &&
               git cat-file -e "$BEFORE^{commit}"; then
            range="$BEFORE..$HEAD_SHA"
          else
            # The previous tip can be missing on an initial push or a history rewrite.
            echo "Previous push tip unavailable. Scanning the complete head history."
            range="$HEAD_SHA"
          fi
          gitleaks git --no-banner --redact=100 --log-opts="--diff-merges=first-parent $range" .
