name: Language check

# English-only gate: every PR into dev/staging/main is scanned for German text.
# A failure prints file:line + the offending token + how to resolve it, so an
# agent gets actionable feedback, fixes the change, and re-submits the PR.
on:
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  english-only:
    name: language-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: German-language gate
        run: python3 tools/check_language.py
